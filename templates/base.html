<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Amalfi Inventario{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-rc.0/css/select2.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0e1420;
            --bg-panel: #141c2b;
            --bg-panel-2: #1a2436;
            --border-soft: #263248;
            --gold: #c9a227;
            --gold-soft: #e2c25a;
            --blue-accent: #4a7fd6;
            --text-main: #e8ecf4;
            --text-muted: #8fa0b8;
        }

        * { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, .brand { font-family: 'Playfair Display', serif; }

        body {
            background: radial-gradient(circle at top left, #16202f 0%, var(--bg-deep) 60%);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* ---------- SIDEBAR ---------- */
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #101827 0%, #0c1220 100%);
            border-right: 1px solid var(--border-soft);
        }
        .sidebar .brand {
            color: var(--gold-soft);
            font-weight: 700;
            font-size: 1.5rem;
            padding: 26px 24px 22px 24px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-soft);
            margin-bottom: 10px;
        }
        .sidebar .brand i { color: var(--gold); margin-right: 8px; }
        .sidebar a {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            margin: 2px 12px;
            border-radius: 8px;
            font-size: 0.94rem;
            font-weight: 500;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .sidebar a i { font-size: 1.05rem; width: 20px; text-align: center; }
        .sidebar a:hover {
            background-color: rgba(201, 162, 39, 0.08);
            color: var(--gold-soft);
        }
        .sidebar a.active {
            background: linear-gradient(90deg, rgba(201,162,39,0.16), rgba(201,162,39,0.02));
            color: var(--gold-soft);
            border-left: 3px solid var(--gold);
            font-weight: 600;
        }

        /* ---------- CONTENT ---------- */
        .flex-grow-1.p-4 { padding: 2.5rem !important; }
        h2 { color: var(--text-main); font-weight: 700; letter-spacing: 0.3px; }
        h2::after {
            content: '';
            display: block;
            width: 46px;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), transparent);
            margin-top: 10px;
            border-radius: 2px;
        }

        /* ---------- CARDS ---------- */
        .card-stat, .card {
            background: var(--bg-panel);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            color: var(--text-main);
        }

        /* ---------- TABLES ---------- */
        table { color: var(--text-main); }
        thead th {
            color: var(--gold-soft) !important;
            border-bottom: 1px solid var(--border-soft) !important;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.6px;
            background: transparent !important;
        }
        tbody tr {
            border-bottom: 1px solid var(--border-soft) !important;
        }
        tbody tr:hover { background-color: rgba(255,255,255,0.02); }
        td, th { border-color: var(--border-soft) !important; }

        /* ---------- FORMS ---------- */
        .form-control, .form-select, .select2-container--default .select2-selection--single {
            background-color: var(--bg-panel-2) !important;
            border: 1px solid var(--border-soft) !important;
            color: var(--text-main) !important;
            border-radius: 8px !important;
        }
        .form-control::placeholder { color: var(--text-muted); }
        .form-control:focus, .form-select:focus {
            border-color: var(--gold) !important;
            box-shadow: 0 0 0 0.2rem rgba(201,162,39,0.15) !important;
        }
        .form-label { color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 6px; }
        .select2-container--default .select2-selection--single .select2-selection__rendered { color: var(--text-main) !important; }
        .select2-dropdown { background-color: var(--bg-panel-2) !important; border: 1px solid var(--border-soft) !important; }
        .select2-container--default .select2-results__option--highlighted[aria-selected] { background-color: var(--gold) !important; color: #111 !important; }
        .select2-search__field { background-color: var(--bg-panel-2) !important; color: var(--text-main) !important; }

        /* ---------- BUTTONS ---------- */
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), #a9821d);
            border: none;
            color: #16202f;
            font-weight: 600;
            border-radius: 8px;
            padding: 9px 22px;
        }
        .btn-primary:hover { background: linear-gradient(135deg, var(--gold-soft), var(--gold)); color: #16202f; }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-soft);
            color: var(--text-muted);
            border-radius: 8px;
            padding: 9px 22px;
        }
        .btn-secondary:hover { border-color: var(--gold); color: var(--gold-soft); background: transparent; }
        .btn-outline-primary {
            border-color: var(--blue-accent);
            color: var(--blue-accent);
            border-radius: 8px;
        }
        .btn-outline-primary:hover { background: var(--blue-accent); border-color: var(--blue-accent); }

        /* ---------- ALERTS ---------- */
        .alert-danger {
            background-color: rgba(220, 53, 69, 0.12);
            border: 1px solid rgba(220, 53, 69, 0.35);
            color: #ff8a94;
        }
        .alert-success {
            background-color: rgba(201, 162, 39, 0.1);
            border: 1px solid rgba(201, 162, 39, 0.35);
            color: var(--gold-soft);
        }
    </style>
</head>
<body>
<div class="d-flex">
    <div class="sidebar" style="width: 260px;">
        <div class="brand"><i class="bi bi-building"></i>Amalfi</div>
        <nav class="px-1">
            <a href="{% url 'core:dashboard' %}" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="{% url 'catalogo:lista_productos' %}"><i class="bi bi-box-seam"></i> Productos</a>
            <a href="{% url 'movimientos:lista_entradas' %}"><i class="bi bi-arrow-down-circle"></i> Entradas</a>
            <a href="{% url 'movimientos:lista_salidas' %}"><i class="bi bi-arrow-up-circle"></i> Salidas</a>
            <a href="{% url 'ubicaciones:lista_ubicaciones' %}"><i class="bi bi-geo-alt"></i> Ubicaciones</a>
            <a href="{% url 'reportes:por_villa' %}"><i class="bi bi-graph-up"></i> Gasto por Villa</a>
            <a href="{% url 'reportes:por_manzana' %}"><i class="bi bi-graph-up"></i> Gasto por Manzana</a>
            <a href="{% url 'reportes:lista_kardex' %}"><i class="bi bi-journal-text"></i> Kardex</a>
            <a href="{% url 'reportes:lista_kardex_villas' %}"><i class="bi bi-house-door"></i> Kardex por Villa</a>
            <a href="/admin/"><i class="bi bi-gear"></i> Admin</a>
        </nav>
    </div>
    <div class="flex-grow-1 p-4">
        {% block content %}{% endblock %}
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-rc.0/js/select2.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
